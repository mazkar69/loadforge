version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loadforge_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/loadforge
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      CLIENT_URL: http://localhost
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis
    networks:
      - loadforge_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loadforge_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - loadforge_net

  mongo:
    image: mongo:7
    container_name: loadforge_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - loadforge_net

  redis:
    image: redis:7-alpine
    container_name: loadforge_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - loadforge_net

volumes:
  mongo_data:

networks:
  loadforge_net:
    driver: bridge
